name: Supabase Free Tier Keep-Alive
on:
  schedule:
    # Runs every 2 days at 06:00 UTC to ensure Supabase never reaches 7 days of inactivity
    - cron: '0 6 */2 * *'
  workflow_dispatch:

jobs:
  ping_database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Reset Inactivity Counter
        run: |
          SUPABASE_URL="https://whwyfqtvuubkfypmgosi.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indod3lmcXR2dXVia2Z5cG1nb3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjcyMzQsImV4cCI6MjEwMzk0MzIzNH0.cDUR7AhCc_5NGgO_iYHAka7wpk0cKTR0GsofBLw-taE"
          
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/templates?select=id&limit=1")
            
          echo "Supabase keep-alive ping response: HTTP ${RESPONSE_CODE}"
          if [ "${RESPONSE_CODE}" -ge 200 ] && [ "${RESPONSE_CODE}" -lt 400 ]; then
            echo "Inactivity counter successfully reset. Supabase database remains active."
          else
            echo "Warning: Received unexpected status ${RESPONSE_CODE}. Please check project status."
            exit 1
          fi
